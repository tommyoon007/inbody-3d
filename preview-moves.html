<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>운동 일러스트 점검</title>
<style>
  body { margin:0; background:#0b1017; color:#e9eef5; font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif; }
  .wrap { display:grid; grid-template-columns:repeat(auto-fill,minmax(200px,1fr)); gap:16px; padding:24px; }
  .cell { background:#121922; border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:14px; text-align:center; }
  .cell svg { width:140px; height:140px; }
  .cell b { display:block; margin-top:6px; font-size:14px; }
  .cell span { font-size:11px; color:#8c9aad; }
  h1 { font-size:16px; padding:20px 24px 0; margin:0; }
  .phone { width:390px; height:844px; border:1px solid rgba(255,255,255,.15); border-radius:18px; margin:8px 24px 40px; }
</style>
</head>
<body>
<h1>운동 동작 일러스트 점검용 (임시)</h1>
<div class="wrap" id="grid"></div>
<h1>모바일 폭(390px) 미리보기</h1>
<iframe class="phone" src="./index.html" title="mobile preview"></iframe>
<script type="module">
import { MOVES } from './moves.js';
const names = {
  walk:'빠르게 걷기', postmeal:'식후 산책', incline:'인클라인 트레드밀', bike:'실내자전거', stairs:'계단·언덕 걷기',
  squat:'스쿼트', legpress:'레그프레스', lunge:'런지',
  pulldown:'랫풀다운', row:'시티드 로우', shoulderpress:'숄더프레스', pushup:'푸시업', plank:'플랭크', deadbug:'데드버그',
  fullbody:'전신 근력(바벨 스쿼트)'
};
document.getElementById('grid').innerHTML = Object.entries(MOVES)
  .map(([k,v]) => `<div class="cell">${v}<b>${names[k]||k}</b><span>${k}</span></div>`).join('');
</script>
</body>
</html>
