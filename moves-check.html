<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>운동 일러스트 애니메이션 점검</title>
<link rel="stylesheet" href="styles.css?v=71" />
<style>
  :root { --mint:#2ee6a8; }
  html,body { margin:0; background:#0a0d12; color:#e9eef5; font-family:"Pretendard","Apple SD Gothic Neo",system-ui,sans-serif; }
  .wrap { padding:18px 14px 60px; }
  h1 { font-size:15px; margin:0 0 10px; }
  p.note { font-size:12px; color:#8c9aad; margin:0 0 14px; }
  .bar { position:sticky; top:0; z-index:5; background:rgba(10,13,18,.92); padding:8px 0 10px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; border-bottom:1px solid rgba(255,255,255,.08); }
  .bar input[type=range] { flex:1 1 240px; }
  .bar output { font-variant-numeric:tabular-nums; font-size:12px; color:#2ee6a8; width:70px; }
  .bar button { font:inherit; font-size:12px; padding:5px 10px; border-radius:8px; background:rgba(255,255,255,.06); color:#cfdae6; border:1px solid rgba(255,255,255,.12); }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(170px,1fr)); gap:12px; margin-top:14px; }
  .tile { background:#121922; border:1px solid rgba(255,255,255,.07); border-radius:14px; padding:10px 8px 8px; text-align:center; }
  .tile .art { width:150px; height:150px; margin:0 auto; }
  .tile .art svg { width:100%; height:100%; display:block; }
  .tile .nm { font-size:12px; font-weight:700; margin-top:4px; }
  .tile .id { font-size:10px; color:#8c9aad; }
</style>
</head>
<body>
<div class="wrap">
  <h1>운동 일러스트 애니메이션 점검 (v71)</h1>
  <p class="note">슬라이더로 애니메이션 시점을 고정해 자세를 확인합니다. (임시 점검용 페이지)</p>
  <div class="bar">
    <input id="t" type="range" min="0" max="1" step="0.01" value="0" />
    <output id="out">0.00</output>
    <button id="play">재생</button>
  </div>
  <div class="grid" id="grid"></div>
</div>
<script type="module">
  import { MOVES } from './moves.js?v=71';
  const names = {
    walk: '빠르게 걷기', postmeal: '식후 산책', incline: '인클라인', bike: '실내자전거',
    stairs: '계단 오르기', squat: '스쿼트', legpress: '레그프레스', lunge: '런지',
    pulldown: '랫풀다운', row: '시티드 로우', pushup: '푸시업', shoulderpress: '숄더프레스',
    plank: '플랭크', deadbug: '데드버그', fullbody: '전신 근력',
  };
  document.getElementById('grid').innerHTML = Object.entries(MOVES).map(([id, svg]) =>
    `<div class="tile"><div class="art" data-id="${id}">${svg}</div>` +
    `<div class="nm">${names[id] || id}</div><div class="id">${id}</div></div>`).join('');

  const slider = document.getElementById('t');
  const out = document.getElementById('out');

  function scrub(v) {
    out.value = v.toFixed(2);
    out.textContent = v.toFixed(2);
    document.getAnimations().forEach(a => {
      a.pause();
      const ct = a.effect.getComputedTiming();
      a.currentTime = v * (ct.activeDuration || 0);
    });
  }
  window.scrub = scrub;

  slider.addEventListener('input', () => scrub(Number(slider.value)));
  document.getElementById('play').addEventListener('click', () => {
    document.getAnimations().forEach(a => a.play());
  });
  setTimeout(() => { slider.value = 0.3; scrub(0.3); }, 400);
</script>
</body>
</html>
